[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "processes-api"
version = "1.1.2"
description = "Kommonitor Processes API"
authors = [
    {name = "Sebastian Drost", email = "s.drost@52north.org"}
]
requires-python = ">=3.8"
dependencies = [
    "prefect>=2.0",
    "pygeoapi",
    "pygeoapi-prefect",
    "openapi-client",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["processor*"]