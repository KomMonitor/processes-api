networks:
  kommonitor:
    name: kommonitor
    driver: bridge

services:
  keycloak:
    image: kommonitor/keycloak:26.5.7-postgres
    entrypoint: /opt/keycloak/bin/kc.sh start-dev
    container_name: keycloak
    restart: unless-stopped
    volumes:
      - ./realms/realm-export.json:/opt/keycloak/data/import/realm.json
      - ./storage/keycloak-db/data:/opt/keycloak/data/h2
    command:
      - --import-realm
      - --features=admin-fine-grained-authz:v1,scripts,token-exchange:v1
    expose:
      - 8080
    ports:
      - 8080:8080
    networks:
      - kommonitor
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_DB=dev-file
  kommonitor-db:
    image: postgis/postgis:15-master
    container_name: kommonitor-db
    restart: unless-stopped
    networks:
      - kommonitor
    ports:
      - 5432:5432
    # Note, when upgrading to PostgreSQL 18+, PGDATA changes
    volumes:
      - ./storage/database/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d ${DB_NAME} -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    env_file:
      - ./config/db.env

  kommonitor-data-management:
    image: kommonitor/data-management:5.2.6
    container_name: kommonitor-data-management
    restart: unless-stopped
    depends_on:
      kommonitor-db:
        condition: service_healthy
    ports:
      - "8085:8085"
    networks:
      - kommonitor
    links:
      - kommonitor-db
    env_file:
      - ./config/data-management.env
      - ./config/keycloak.env